steps:
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm install -g pnpm
        pnpm install
        pnpm test
    id: "test"

  # 2. Build, Cache, and Push via Docker Buildx
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # Initialize a new buildx builder instance
        docker buildx create --use

        # Run buildx build (Notice we changed `docker build` to `docker buildx build` and added `--push`)
        docker buildx build -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA} \
        --platform linux/amd64 \
        --build-arg NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL} \
        --cache-from type=registry,ref=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:buildcache \
        --cache-to type=registry,ref=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:buildcache,mode=max \
        --push \
        -f ./Dockerfile .
    id: "build-and-push"

  # 3. Deploy to Google Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA} \
          --region ${_REGION} \
          --execution-environment gen2 \
          --memory 2Gi \
          --cpu 1 \
          --port 8000 \
          --allow-unauthenticated \
          --set-secrets="/secrets/${_SECRET_NAME}=${_SECRET_NAME}:latest"
    id: "deploy"

timeout: "1800s"
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: "us-central1"
  _REPO_NAME: "rewaa-repo"
  _SERVICE_NAME: "nextjs-template"
  _SECRET_NAME: "nextjs-template-env"
  _NEXT_PUBLIC_API_URL: "https://nestjs-template-960782008262.us-central1.run.app"
